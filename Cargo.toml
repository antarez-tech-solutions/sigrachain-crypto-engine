[package]
name = "sigrachain-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Cryptographic engine for SigraChain e-signature verification"

[dependencies]
# Pinned to exact resolved versions for reproducible builds.
sha2 = { version = "=0.10.9", features = ["asm"] }
ring = "=0.17.14"
hex = "=0.4.3"
thiserror = "=2.0.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = { version = "=1.8.2", features = ["derive"] }
rayon = { version = "=1.11.0", optional = true }
log = "=0.4.29"

[features]
default = []
parallel = ["rayon"]

[dev-dependencies]
proptest = "=1.9.0"
criterion = { version = "=0.5.1", features = ["html_reports"] }

[[bench]]
name = "crypto_benchmarks"
harness = false
